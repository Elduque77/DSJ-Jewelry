; Ajuste del pool de PHP-FPM para DSJ en Amazon Linux 2023.
; Instalar con:
;   sudo cp /var/www/dsj/deploy/php-fpm-dsj-amazonlinux.conf /etc/php-fpm.d/zz-dsj.conf
;   sudo systemctl restart php-fpm
;
; IMPORTANTE: en Amazon Linux / RHEL el pool por defecto corre como usuario
; "apache", no "nginx". Si no se cambia, PHP escribe en storage/ como apache
; mientras Nginx sirve como nginx, y acabas peleando con permisos. Aqui se
; unifica todo en el usuario "nginx".

[www]
user = nginx
group = nginx

listen = /run/php-fpm/www.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; "ondemand": los procesos nacen con el trafico y mueren al quedar inactivos,
; que es lo que conviene en una instancia pequena.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500

; En produccion los errores van al log, nunca a la pantalla del visitante.
php_admin_value[display_errors] = Off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/dsj-error.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
