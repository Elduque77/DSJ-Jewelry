; Ajuste del pool de PHP-FPM para una EC2 pequena (1-2 GB de RAM).
; Instalar con:
;   sudo cp /var/www/dsj/deploy/php-fpm-dsj.conf /etc/php/8.4/fpm/pool.d/zz-dsj.conf
;   sudo systemctl restart php8.4-fpm
;
; Sobrescribe valores del pool [www] que trae Ubuntu. Con "ondemand" los
; procesos se crean solo cuando llega trafico y mueren al quedar inactivos,
; que es lo que conviene en t3.micro/t3.small.

[www]
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500

; En produccion nunca mostrar errores PHP al visitante: van al log.
php_admin_value[display_errors] = Off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
