# Sitio Nginx para DSJ en EC2 **Amazon Linux 2023** (acceso por DNS publico, HTTP).
# Diferencias con Ubuntu: el socket de PHP-FPM vive en /run/php-fpm/www.sock y
# los sitios van en /etc/nginx/conf.d/, no en sites-available/sites-enabled.
# Instalar con:
#   sudo cp /var/www/dsj/deploy/nginx/dsj-amazonlinux.conf /etc/nginx/conf.d/dsj.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Al pasar a dominio propio: poner aqui "dsj.midominio.com" y quitar
    # "default_server" de las dos lineas listen de arriba.
    server_name _;

    # OJO: la raiz es public/, nunca la raiz del proyecto.
    root /var/www/dsj/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # No anunciar la version de Nginx.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/dsj-access.log;
    error_log  /var/log/nginx/dsj-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Los assets de Vite llevan hash en el nombre, asi que se pueden cachear
    # para siempre: un deploy nuevo genera nombres nuevos.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # El "=404" evita que se ejecute PHP sobre rutas que no existen.
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Bloquear .env, .git, .gitignore y compania.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}

# NOTA: Amazon Linux trae su propio bloque "server" por defecto dentro de
# /etc/nginx/nginx.conf, pero sin la palabra "default_server", asi que este
# archivo gana sin conflicto. Si aun asi "nginx -t" dijera
# "duplicate default server", comenta ese bloque en /etc/nginx/nginx.conf.
